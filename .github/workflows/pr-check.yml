name: PR Validation

on:
pull_request:
branches:
- main

jobs:
validate-pr:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install Dependencies
    run: npm ci

  - name: Run Lint
    run: npm run lint

  - name: Run Tests
    run: npm test

  - name: App Boot Check
    run: |
      node src/index.js &
      sleep 5
      kill $!
```
