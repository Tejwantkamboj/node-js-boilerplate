name: Push Validation

on:
  push:
    branches:
      - "feature/*"
      - "bugfix/*"
      - "chore/*"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      MONGODB_URL: mongodb://127.0.0.1:27017/node-boilerplate
      JWT_SECRET: testsecret

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Test Check
        run: npm test

      - name: App Boot Check
        run: |
          node src/index.js &
          APP_PID=$!
          sleep 10
          kill $APP_PID

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-merge validated changes"
          title: "✅ Auto PR: ${{ github.ref_name }}"
          body: |
            ## Automated Pull Request
            
            This PR was automatically created after successful validation on branch `${{ github.ref_name }}`.
            
            **Validation Status:** ✅ All checks passed
            - Lint Check
            - Test Check
            - App Boot Check
          branch: ${{ github.ref_name }}
          base: master
          delete-branch: false
